<div class="dash">
  <div class="top">
    <div class="title">RAD <b>{{ name|capitalize }}</b></div>
    <div class="meta"><span class="num" data-clock="hm">--:--</span><span data-clock="date">{{ today }}</span></div>
  </div>
  <div class="body">
    <div class="card" style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px">
      <div class="label">Dashboard fault</div>
      <div style="font-size:34px;color:var(--hot)">This dashboard could not render.</div>
      <div class="dim" style="font-size:20px;max-width:1000px;text-align:center">{{ error }}</div>
    </div>
  </div>
  <div class="foot"><span>The other dashboards still work.</span><span></span></div>
</div>
